<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 测试报告助手</title>
<style>
*{box-sizing:border-box}body{font-family:"Microsoft YaHei",Arial;background:#f4f7fb;margin:0;color:#1f2937}.container{max-width:1200px;margin:32px auto;padding:24px}.card{background:#fff;border-radius:18px;padding:24px;margin-bottom:20px;box-shadow:0 8px 30px #0001}h1{margin-top:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.stat{padding:20px;border-radius:14px;background:#eef4ff}.stat b{font-size:28px}.toolbar button{margin-right:10px;padding:12px 18px;border:0;border-radius:10px;cursor:pointer;background:#2563eb;color:white}textarea,input{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px}textarea{min-height:240px}pre{white-space:pre-wrap;background:#0f172a;color:#e2e8f0;padding:20px;border-radius:14px;min-height:240px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="container">
<div class="card"><h1>🚀 AI 测试报告助手</h1><p>智能生成测试总结、风险分析和改进建议</p></div>
<div class="card"><label>测试数据</label><textarea id="data">{"total_cases":500,"passed":468,"failed":22,"blocked":10}</textarea><br><br><label>分析要求</label><input id="instruction" value="重点分析高优先级缺陷、版本风险，并给出回归建议。"><br><br><button onclick="analyze()">生成报告</button></div>
<div class="card grid"><div class="stat">测试用例<br><b id="total">-</b></div><div class="stat">通过率<br><b id="rate">-</b></div><div class="stat">报告状态<br><b>AI</b></div></div>
<div class="card toolbar"><button onclick="download('md')">导出 Markdown</button><button onclick="download('html')">导出 PDF(打印)</button><button onclick="download('doc')">导出 Word</button></div>
<div class="card"><h2>测试报告</h2><pre id="result">等待分析...</pre></div>
</div>
<script>
let report='';
async function analyze(){let r=document.getElementById('result');r.textContent='分析中...';try{let res=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({test_data:data.value,instruction:instruction.value})});let b=await res.json();report=b.report;result.textContent=report+'\n\n[model] '+b.model;let d=JSON.parse(data.value);total.textContent=d.total_cases||'-';rate.textContent=d.total_cases?((d.passed/d.total_cases)*100).toFixed(1)+'%':'-'}catch(e){r.textContent=e.message}}
function download(type){let blob;if(type==='md')blob=new Blob([report||result.textContent],{type:'text/markdown'});else blob=new Blob(['AI测试报告\n\n'+(report||result.textContent)],{type:'text/plain'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='AI_Test_Report.'+(type==='md'?'md':type==='doc'?'doc':'txt');a.click()}
</script></body></html>
